services:
  postgres:
    image: postgres:17
    container_name: espor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: espor_dev
      POSTGRES_USER: espor_user
      POSTGRES_PASSWORD: espor_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
